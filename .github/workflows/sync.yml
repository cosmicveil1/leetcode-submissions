name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *" # Hourly; GitHub may delay scheduled runs.

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Verify sync logic
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Archive accepted SQL and Pandas submissions
        env:
          LEETCODE_USERNAME: saumya1234
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python3 .github/scripts/sync_leetcode.py
      - name: Commit submissions
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- my-submissions .leetcode-sync.json
          if git diff --cached --quiet; then
            echo 'All accepted SQL/Pandas submissions are already archived.'
            exit 0
          fi
          git commit -m 'Sync accepted SQL and Pandas submissions'
          for attempt in 1 2 3; do
            git pull --rebase origin "$DEFAULT_BRANCH"
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          echo 'Could not push after three attempts; the next run will retry the archive.'
          exit 1
