name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # Runs every day at 8 AM UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: my-submissions
